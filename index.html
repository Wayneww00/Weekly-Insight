<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Insight Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main id="login-screen" class="login-screen">
      <section class="login-card" aria-labelledby="login-title">
        <div class="login-brand">
          <div class="login-logo-mark" aria-hidden="true">
            <img src="./assets/vantage-logo-white.svg" alt="" />
          </div>
          <div>
            <strong>Vantage BI Digest</strong>
            <span>竞品情报监测平台</span>
          </div>
        </div>
        <div class="login-divider"></div>
        <div class="login-heading">
          <h1 id="login-title">登录</h1>
          <p>请输入已获授权的账号和密码。</p>
        </div>
        <form id="login-form" class="login-form">
          <label>
            <span>邮箱</span>
            <input id="login-email" name="email" type="email" value="admin@vtg.bot" autocomplete="username" required />
          </label>
          <label>
            <span>密码</span>
            <input id="login-password" name="password" type="password" autocomplete="current-password" required />
          </label>
          <p id="login-error" class="login-error" role="alert" hidden></p>
          <button id="login-submit" class="login-submit" type="submit">登录</button>
        </form>
      </section>
    </main>

    <main id="app-shell" class="app-layout" hidden>
      <!-- Mobile header: only visible on small screens -->
      <header class="mobile-header">
        <div class="brand">
          <img src="./assets/vantage-logo-white.svg" alt="vantage" />
        </div>
        <button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-label="打开菜单">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M2.5 5h15M2.5 10h15M2.5 15h15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
        </button>
      </header>

      <aside class="sidebar" id="sidebar">
        <div class="sidebar-scroll">
          <div class="sidebar-control">
            <div class="brand desktop-only">
              <img src="./assets/vantage-logo-white.svg" alt="vantage" />
            </div>

            <!-- Search -->
            <div class="search-box">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.5" />
                <path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
              </svg>
              <input id="search-input" type="search" placeholder="搜索标题…" />
            </div>

            <!-- Filters -->
            <div class="filter-tabs" aria-label="内容类型筛选">
              <button type="button" class="active" data-filter-type="">全部</button>
              <button type="button" data-filter-type="weekly">Weekly</button>
              <button type="button" data-filter-type="monthly">Monthly</button>
            </div>
          </div>

          <nav class="issue-nav" aria-label="Insight files">
            <section>
              <p class="nav-label">最新一期</p>
              <div id="current-list" class="nav-list"></div>
            </section>

            <section>
              <p class="nav-label">历史归档</p>
              <div id="history-list" class="nav-list"></div>
            </section>
          </nav>
        </div>

        <div class="sidebar-actions">
          <button id="open-upload" class="upload-entry" type="button">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M14 10.5v2a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 12.5v-2M11 5 8 2 5 5M8 2v9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            上传 PPT / PDF
          </button>
          <p id="sidebar-status" class="sidebar-status" hidden></p>
          <div class="account-actions">
            <button id="logout-button" type="button">
              <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path d="M6.5 2.25H3.75A1.75 1.75 0 0 0 2 4v8a1.75 1.75 0 0 0 1.75 1.75H6.5M9.25 5.25 12 8l-2.75 2.75M12 8H5" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              退出登录
            </button>
          </div>
        </div>
      </aside>

      <dialog id="upload-dialog" class="upload-dialog" aria-labelledby="upload-title">
        <form method="dialog" class="upload-panel">
          <div class="upload-panel-header">
            <div>
              <p class="panel-kicker">Publish Insight</p>
              <h2 id="upload-title">上传 PPT / PDF</h2>
            </div>
            <button class="dialog-close" type="button" data-close-upload aria-label="关闭上传面板">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
          <div class="upload-type-tabs" aria-label="上传类型">
            <button type="button" class="active" data-insight-type="weekly">Weekly</button>
            <button type="button" data-insight-type="monthly">Monthly</button>
          </div>
          <div class="upload-fields">
            <label>
              <span>所属日期</span>
              <input id="issue-date" type="date" />
            </label>
            <label class="latest-toggle">
              <input id="mark-latest" type="checkbox" checked />
              <span>上传后设为最新一期</span>
            </label>
          </div>
          <div id="dropzone" class="dropzone">
            <input id="file-input" type="file" accept=".ppt,.pptx,.pdf,application/pdf" />
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
            <span class="dropzone-label">上传 PPT / PDF</span>
            <span class="dropzone-hint">点击选择或拖拽文件到此处</span>
            <div id="selected-file" class="selected-file" hidden></div>
          </div>
          <p id="upload-status" class="upload-status" hidden></p>
        </form>
      </dialog>

      <!-- Overlay for mobile sidebar -->
      <div class="sidebar-overlay" id="sidebar-overlay"></div>

      <section class="viewer">
        <header class="viewer-header">
          <div class="viewer-header-main">
            <div class="viewer-kicker">
              <span class="status-dot"></span>
              <span id="viewer-type">Weekly Insight</span>
            </div>
            <h1 id="viewer-title">Insight Hub</h1>
            <p id="viewer-summary">选择左侧文件查看内容。</p>
          </div>
          <div class="viewer-header-meta" id="viewer-meta"></div>
        </header>

        <div id="viewer-content" class="viewer-content"></div>
      </section>
    </main>

    <script src="./src/app.js"></script>
  </body>
</html>
